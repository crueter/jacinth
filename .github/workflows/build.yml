name: Build and Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate Build Matrix
        id: matrix
        run: |
          echo "matrix=$(./.ci/matrix.sh)" >> "$GITHUB_OUTPUT"
          .ci/matrix.sh

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    name: "${{ matrix.os.name }} ${{ matrix.os.program }}${{ matrix.os.refl == true && ' Reflection' || '' }}"
    runs-on: ${{ matrix.os.runs-on }}
    container: ${{ matrix.os.container }}

    defaults:
      run:
        shell: ${{ matrix.os.msystem && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Packages (Arch Linux)
        if: matrix.os.container
        run: pacman -Syu --noconfirm --needed cmake ninja ${{ matrix.os.program }}

      - name: Install Packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm cmake ninja

      - name: Setup MSYS2
        if: matrix.os.msystem
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.os.msystem }}
          update: true
          pacboy: >-
            toolchain:p cmake:p ninja:p

      - name: Setup MSVC
        if: matrix.os.name == 'Windows'
        uses: crueter/setup-msvc-dev@master

      - name: Install LLVM/Clang
        if: matrix.os.program == 'clang-cl'
        uses: Nerixyz/install-llvm-action@feat/new-llvm-versions
        with:
          version: 23
          env: true

      - name: Configure
        run: |
          case "${{ matrix.os.program }}" in
            # gcc is already default where needed
            msvc|gcc) ;;
            clang-cl)
              cc=clang-cl
              cxx=clang++ ;;
            clang|appleclang)
              cc=clang
              cxx=clang++ ;;
            brew-clang)
              p="$(brew --prefix llvm)/bin"
              cc="${p}/clang"
              cxx="${p}/clang++" ;;
          esac

          refl=OFF
          if [ "${{ matrix.os.refl }}" = "true" ]; then
            refl=ON
          fi

          if [ -n "$cc" ] && [ -n "$cxx" ]; then
            set -- "-DCMAKE_C_COMPILER=$cc" "-DCMAKE_CXX_COMPILER=$cxx"
          fi

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJACINTH_USE_SYSTEM_PFR=OFF \
            -DJACINTH_USE_SYSTEM_YYJSON=OFF -DJACINTH_USE_REFLECTION="$refl" -G Ninja "$@"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
